services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
      - TZ=Asia/Shanghai
    volumes:
      # bind mount 到本地，备份/迁移直接打包这个目录即可
      - ./data/postgres:/var/lib/postgresql/data
    # 🚀 PostgreSQL 高性能配置（128G 内存服务器优化）
    command: >
      postgres
      -c shared_buffers=8GB
      -c effective_cache_size=64GB
      -c work_mem=64MB
      -c maintenance_work_mem=2GB
      -c max_connections=200
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=500
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 4G

  n8n:
    image: n8nio/n8n:2.29.10
    container_name: n8n-main
    restart: unless-stopped
    network_mode: host
    depends_on:
      - postgres
    environment:
      # ---- 数据库切到 postgres（host 网络下，走 127.0.0.1） ----
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=127.0.0.1
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # 🚀 数据库连接池优化（从默认 2 提升到 50）
      - DB_POSTGRESDB_POOL_SIZE=50
      - DB_POSTGRESDB_POOL_IDLE_TIMEOUT=60000

      # ---- task-runner（n8n 2.x 关键，保持不动） ----
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=127.0.0.1
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_NATIVE_PYTHON_RUNNER=true

      # ---- 监听地址（宝塔反代到此端口） ----
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_PORT=5681

      # ---- 公网访问（HTTPS 由宝塔处理） ----
      - N8N_HOST=${DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN}/

      # ---- 其它通用 ----
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai

      # 🚀 性能优化：执行历史自动清理（避免数据库膨胀导致查询变慢）
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000

      # 🚀 性能优化：负载和超时
      - N8N_PAYLOAD_SIZE_MAX=128
      - EXECUTIONS_TIMEOUT=3600
      - EXECUTIONS_TIMEOUT_MAX=7200

      # 🚀 日志配置
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
    volumes:
      # 工作流元数据/凭证加密 key/二进制文件等都在这里，必须备份
      - ./data/n8n:/home/node/.n8n
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 2G

  task-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n-runner
    restart: unless-stopped
    network_mode: host
    environment:
      # host 网络下，task-runner 通过 127.0.0.1 连 n8n 的 broker
      - N8N_RUNNERS_TASK_BROKER_URI=http://127.0.0.1:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_STDLIB_ALLOW=*
      - N8N_RUNNERS_EXTERNAL_ALLOW=*
      - TZ=Asia/Shanghai
    depends_on:
      - n8n
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
